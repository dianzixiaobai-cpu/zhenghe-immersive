<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141514" />
    <meta name="description" content="《向海而和》郑和船队沉浸式手势交互原型" />
    <link rel="icon" href="data:," />
    <title>向海而和</title>
    <script type="module" crossorigin src="./assets/main-mdlvgzYP.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/three.module-CScPE-k7.js">
    <link rel="stylesheet" crossorigin href="./assets/main-Dy-4aqxZ.css">
  </head>
  <body>
    <main id="app" aria-label="向海而和沉浸式交互体验">
      <canvas id="voyage-map" aria-hidden="true"></canvas>
      <div id="scene" aria-hidden="true"></div>
      <video id="hand-video" playsinline muted></video>
      <audio id="background-music" preload="auto" loop>
        <source src="./audio/zuiyu-changwan.ogg" type="audio/ogg" />
      </audio>
      <canvas id="ink-layer" aria-hidden="true"></canvas>

      <section id="route-map" class="route-map" aria-label="郑和船队航线" hidden>
        <canvas id="route-canvas"></canvas>
        <div id="route-place" class="route-place">刘家港</div>
      </section>

      <section id="cargo-status" class="cargo-status" aria-live="polite" hidden>
        <div class="cargo-status-heading">
          <span id="cargo-port">刘家港</span>
          <small id="cargo-event">中国物产装船</small>
        </div>
        <div id="cargo-list" class="cargo-list"></div>
      </section>

      <section id="country-stop" class="country-stop" aria-live="polite" role="dialog" hidden>
        <button id="country-stop-close" class="view-close country-stop-close" type="button" aria-label="关闭国家介绍并继续航行" title="继续航行">×</button>
        <figure class="country-visual">
          <img id="country-image" alt="" />
          <figcaption>
            <span id="country-image-title"></span>
            <small>《瀛涯胜览》行旅图景</small>
          </figcaption>
        </figure>
        <div class="country-reading">
          <header class="country-heading">
            <small>泊驻</small>
            <h1 id="country-title"></h1>
            <p id="country-subtitle"></p>
          </header>
          <div class="country-scroll">
            <section class="country-classical" aria-label="文言文">
              <span>原文</span>
              <div id="country-classical"></div>
            </section>
            <section class="country-modern" aria-label="现代文翻译">
              <span>今译</span>
              <div id="country-modern"></div>
            </section>
          </div>
        </div>
      </section>

      <section id="detail-panel" class="detail-panel" aria-live="polite" hidden>
        <button id="detail-close" class="view-close detail-close" type="button" aria-label="关闭货物介绍" title="关闭货物介绍">×</button>
        <div id="detail-model-host" class="detail-model-host" hidden>
          <div id="detail-model-status" class="detail-model-status" role="status">
            <i aria-hidden="true"></i>
            <span id="detail-model-status-text">正在载入写实三维模型</span>
          </div>
        </div>
        <div class="detail-copy">
          <div id="detail-kicker" class="detail-kicker"></div>
          <h1 id="detail-title"></h1>
          <p id="detail-body"></p>
        </div>
      </section>

      <button id="ship-view-close" class="view-close ship-view-close" type="button" aria-label="收起船体并继续航行" title="继续航行" hidden>×</button>

      <div id="place-seal" class="place-seal" hidden>
        <span id="place-cn"></span>
        <small id="place-sub"></small>
      </div>

      <div id="cargo-cursors" class="cargo-cursors" aria-hidden="true" hidden></div>
      <div id="gesture-cursor" class="gesture-cursor" aria-hidden="true"><span></span></div>

      <div id="presence" class="presence" aria-live="polite">
        <div class="presence-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <span id="presence-label">寻找你的手</span>
      </div>

      <button id="music-toggle" class="music-toggle" type="button" aria-label="关闭背景音乐" title="关闭背景音乐">
        <span aria-hidden="true">♫</span>
      </button>

      <button id="start-experience" class="start-experience" type="button" aria-label="启用摄像头并进入体验">
        <span class="hand-glyph" aria-hidden="true">手</span>
      </button>

      <div id="debug-hint" class="debug-hint" hidden>点击小船暂停 · 拖动旋转 · 点击货物查看 · Esc 返回</div>
    </main>
  </body>
</html>
